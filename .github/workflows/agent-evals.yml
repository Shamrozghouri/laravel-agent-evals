name: Agent Evals

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  agent-evals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --no-audit --no-blocking --prefer-stable

      - name: Run Agent Evals
        run: composer test